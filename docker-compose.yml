# Entorno de desarrollo completo (T-004, cierra H0).
#
#   docker compose up --build          mysql + redis + api + web
#   docker compose --profile ingest run --rm ingest --game YGO --sets 3
#
# El objetivo es que arrancar el proyecto sea UN comando. La base de datos la
# crea la propia imagen de MySQL (MYSQL_DATABASE), y las migraciones se aplican
# solas al arrancar la API: aqui no hay ningun paso manual previo.
#
# Los valores por defecto son de desarrollo y estan a la vista a proposito. Lo
# unico que NO tiene valor por defecto es JWT_SECRET: quien lo conozca puede
# firmar un token para cualquier usuario (ADR-008), asi que compose se niega a
# arrancar si falta, igual que se niega el servidor.

name: proyecto-tcg

# Configuracion que comparten la API y el CLI de ingesta. Son el mismo binario
# con distinto punto de entrada, y deben ver exactamente el mismo entorno.
x-api-env: &api-env
  DATABASE_URL: mysql://${MYSQL_USER:-tcg}:${MYSQL_PASSWORD:-cambiame}@mysql:3306/${MYSQL_DATABASE:-proyecto_tcg}
  REDIS_URL: redis://redis:6379
  STORAGE_PATH: /app/storage/cards
  MIGRATIONS_DIR: /app/db/migrations
  # Dentro del contenedor hay que escuchar en todas las interfaces; el 127.0.0.1
  # por defecto del servidor solo seria alcanzable desde el propio contenedor.
  HOST: 0.0.0.0
  PORT: "3000"
  JWT_SECRET: '${JWT_SECRET:?falta JWT_SECRET en .env — mira .env.example}'
  EXTERNAL_USER_AGENT: '${EXTERNAL_USER_AGENT:?falta EXTERNAL_USER_AGENT en .env — Scryfall bloquea a quien no envia uno propio}'
  POKEMONTCG_API_KEY: ${POKEMONTCG_API_KEY:-}

services:
  mysql:
    image: mysql:8.0.42
    restart: unless-stopped
    # El esquema usa indices multivaluados sobre JSON y CHECK: la version no es
    # una preferencia. utf8mb4_0900_ai_ci es la intercalacion del DDL.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-proyecto_tcg}
      MYSQL_USER: ${MYSQL_USER:-tcg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cambiame}
    ports:
      # 3307 por defecto y no 3306: la maquina de desarrollo ya tiene un MySQL
      # instalado escuchando en 3306, y publicar ahi fallaria al arrancar.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # --protocol=tcp a proposito: durante la inicializacion el entrypoint de
      # MySQL levanta el servidor con --skip-networking, y un ping por socket
      # daria "sano" cuando la base todavia no acepta conexiones.
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly para que las cuotas diarias (T-017) sobrevivan a un reinicio.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *api-env
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Las imagenes re-hospedadas viven fuera de la imagen y fuera de git: son
      # GB y se comparten con el CLI de ingesta.
      - ./storage:/app/storage
    healthcheck:
      # Sin curl en la imagen slim; fetch nativo de Node hace el mismo trabajo.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    depends_on:
      - api
    environment:
      # El proxy de Vite apunta al servicio `api` por nombre de red, no a
      # 127.0.0.1, que dentro del contenedor es el propio contenedor.
      API_PROXY_TARGET: http://api:3000
      # El bind mount desde Windows no propaga eventos inotify al contenedor.
      VITE_USE_POLLING: "1"
      # Dentro de la red de compose el Host es el nombre del servicio, y Vite
      # responde 403 a lo que no reconoce. Lo necesita la suite E2E (P-028).
      VITE_ALLOWED_HOSTS: web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      # Montar solo lo que se edita: node_modules y packages/shared/dist tienen
      # que seguir siendo los de la imagen.
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/index.html:/app/apps/web/index.html:ro

  # Ejecucion puntual, no un servicio: la ingesta se lanza a mano y termina.
  #   docker compose --profile ingest run --rm ingest --game YGO --sets 3
  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *api-env
    entrypoint: ["node", "apps/api/dist/cli/ingest.js"]
    volumes:
      - ./storage:/app/storage

  # Suite E2E (H8a). Perfil, no servicio: se ejecuta a mano y termina.
  #   docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      E2E_BASE_URL: http://web:5173
      E2E_API_URL: http://api:3000
    volumes:
      # Los artefactos salen al host para poder mirarlos: es medio sentido de
      # T-053.
      - ./e2e/artefactos:/app/artefactos

volumes:
  db_data:
  redis_data:
